<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listening 12 – Giáo viên</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ok:#15803d;--bad:#b91c1c;--bd:#e3e1d9}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--card:#1f2229;--tx:#e8e9ec;--mut:#9aa1ad;--ok:#4ade80;--bad:#f87171;--bd:#323640}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:18px 14px 48px}
h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--bad)}.pill{padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
</style></head><body><main>
<h1>Theo dõi lớp – Listening 12</h1>
<div class="mut" id="info">Đang tải…</div>
<div class="card"><div class="wrap"><table><thead id="h"></thead><tbody id="b"></tbody></table></div></div>
<button id="csv">Tải bảng điểm (.csv)</button>
<script>
// ====== CẤU HÌNH: phải trùng với student.html ======
const DB_URL = "https://TEN-DU-AN-default-rtdb.firebaseio.com";
const CLASS_ID = "lop12a1";
// ===================================================
const NQ=[5,5], $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>Math.floor(s/60)+"p "+String(s%60).padStart(2,"0")+"s";
const hm=t=>t?new Date(t).toLocaleTimeString("vi-VN"):"–";
const keys=[];[1,2].forEach(e=>{for(let i=1;i<=5;i++)keys.push("e"+e+"_"+i)});
$("#h").innerHTML='<tr><th>Tên</th><th>Trạng thái</th><th>Bắt đầu</th><th>Nộp lúc</th><th>Thời gian</th><th>Bài 1</th><th>Bài 2</th><th>Tổng</th>'+keys.map(k=>'<th>'+k.replace("e","B").replace("_",".")+'</th>').join('')+'</tr>';
let rows=[];
async function load(){
  try{
    const r=await fetch(DB_URL+"/"+CLASS_ID+".json");const d=(await r.json())||{};
    rows=Object.values(d).sort((a,b)=>(a.startedAt||0)-(b.startedAt||0));
    const done=rows.filter(x=>x.status==="done");
    const avg=done.length?(done.reduce((s,x)=>s+x.total,0)/done.length).toFixed(1):"–";
    $("#info").textContent="Tổng "+rows.length+" học sinh · đã nộp "+done.length+" · điểm TB "+avg+"/10 · tự cập nhật mỗi 3 giây";
    $("#b").innerHTML=rows.map(x=>{const f=x.status==="done",dur=f?Math.round((x.submittedAt-x.startedAt)/1000):null;
      return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+(f?'<span class="pill ok">Đã nộp</span>':'<span class="pill">Đang làm</span>')+'</td><td>'+hm(x.startedAt)+'</td><td>'+hm(x.submittedAt)+'</td><td>'+(f?fmt(dur):"–")+'</td>'+
      [0,1].map(i=>'<td>'+(f?x.scores[i]+'/'+NQ[i]:"–")+'</td>').join('')+'<td>'+(f?'<b>'+x.total+'/10</b>':"–")+'</td>'+
      keys.map(k=>{const a=f&&x.answers&&x.answers[k];return a?'<td class="'+(a.ok?"ok":"bad")+'">'+esc(a.v)+'</td>':"<td>–</td>"}).join('')+'</tr>'}).join("")||'<tr><td colspan="8" class="mut">Chưa có học sinh nào.</td></tr>';
  }catch(e){$("#info").textContent="Không kết nối được Firebase. Kiểm tra DB_URL."}
}
$("#csv").onclick=()=>{
  const L=[["Ten","Trang thai","Bat dau","Nop luc","Thoi gian (giay)","Bai 1","Bai 2","Tong"].concat(keys)];
  rows.forEach(x=>{const f=x.status==="done";L.push([x.name,x.status,hm(x.startedAt),hm(x.submittedAt),f?Math.round((x.submittedAt-x.startedAt)/1000):"",f?x.scores[0]:"",f?x.scores[1]:"",f?x.total:""].concat(keys.map(k=>f&&x.answers[k]?x.answers[k].v:"")))});
  const csv="\ufeff"+L.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="listening12.csv";a.click();
};
load();setInterval(load,3000);
</script></main></body></html>
